# add-on

addon.onlycat.name = OnlyCat Binding
addon.onlycat.description = Integrates OnlyCat smart cat flaps: presence of your cats, flap events, prey detection, door policies and remote unlock.

# thing status descriptions

offline.config-error.missing-api-key = The API key is not set
offline.config-error.invalid-api-key = The API key was rejected; create a new one in the OnlyCat app
offline.config-error.missing-device-id = The device ID is not set
offline.config-error.unknown-flap = The account has no flap with this device ID
offline.config-error.missing-rfid-code = The RFID code is not set
offline.config-error.unknown-cat = The account has no cat with this RFID code

# actions

action.unlock.label = Unlock
action.unlock.description = Unlocks the flap for a single passage.
action.reboot.label = Reboot
action.reboot.description = Reboots the flap.
action.activate-door-policy.label = Activate Door Policy
action.activate-door-policy.description = Activates a door policy by name or ID.
