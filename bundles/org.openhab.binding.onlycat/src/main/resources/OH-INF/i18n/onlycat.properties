action.get-door-policies.description = Returns all door policies of the flap as JSON.
action.update-door-policy.label = Update Door Policy
action.update-door-policy.description = Changes an existing door policy.
action.input.policy = Door Policy
action.input.policy-json = Door Policy JSON
action.output.success = Success
