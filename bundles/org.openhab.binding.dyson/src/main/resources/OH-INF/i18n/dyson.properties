# thing types config

thing-type.config.dyson.account.country.label = Country
thing-type.config.dyson.account.country.description = Two letter country code of the account, e.g. US, GB, DE or CN.
thing-type.config.dyson.account.culture.label = Culture
thing-type.config.dyson.account.culture.description = Language and country of the account, e.g. en-US, en-GB or de-DE.
thing-type.config.dyson.account.email.label = E-mail
thing-type.config.dyson.account.email.description = E-mail address of the MyDyson account. In the China region a mobile number including the country code (e.g. +8613800000000) can be used instead.
thing-type.config.dyson.account.otp.label = Verification Code
thing-type.config.dyson.account.otp.description = One-time verification code that Dyson sends by e-mail (or SMS) when the binding logs in. Enter it here to complete the login; it is cleared afterwards.
thing-type.config.dyson.account.password.label = Password
thing-type.config.dyson.account.password.description = Password of the MyDyson account. Not required for a mobile number login.
thing-type.config.dyson.account.refreshInterval.label = Refresh Interval
thing-type.config.dyson.account.refreshInterval.description = Interval in minutes to refresh the device list and the firmware information.
thing-type.config.dyson.account.token.label = Token
thing-type.config.dyson.account.token.description = Authentication token, filled in automatically after a successful login. Clear it to force a new login.
thing-type.config.dyson.device.capabilities.label = Capabilities
thing-type.config.dyson.device.capabilities.description = Comma separated device capabilities, e.g. AdvanceOscillationDay1,Scheduling,ExtendedAQ,Heating, Humidifier. Retrieved from the cloud when an account bridge is used.
thing-type.config.dyson.device.connectionType.label = Connection Type
thing-type.config.dyson.device.connectionType.description = How to connect to the device. Cloud connections require a Dyson account bridge.
thing-type.config.dyson.device.connectionType.option.LOCAL = Local only
thing-type.config.dyson.device.connectionType.option.LOCAL_CLOUD_FALLBACK = Local with cloud fallback
thing-type.config.dyson.device.connectionType.option.CLOUD_LOCAL_FALLBACK = Cloud with local fallback
thing-type.config.dyson.device.connectionType.option.CLOUD = Cloud only
thing-type.config.dyson.device.group.connection.label = Connection
thing-type.config.dyson.device.group.manual.label = Manual Setup
thing-type.config.dyson.device.group.manual.description = Only needed without a Dyson account bridge (e.g. from the sticker on the device).
thing-type.config.dyson.device.hostname.label = Host Name
thing-type.config.dyson.device.hostname.description = Host name or IP address of the device for local connections. Defaults to <serial number>.local (mDNS). A fixed IP address is recommended.
thing-type.config.dyson.device.localPassword.label = Local Password
thing-type.config.dyson.device.localPassword.description = Password of the MQTT broker on the device (Wi-Fi password from the sticker). Retrieved from the cloud when an account bridge is used.
thing-type.config.dyson.device.mqttPrefix.label = MQTT Prefix
thing-type.config.dyson.device.mqttPrefix.description = Root MQTT topic of the device (product type), e.g. 438M or 527. Retrieved from the cloud when an account bridge is used.
thing-type.config.dyson.device.refreshInterval.label = Refresh Interval
thing-type.config.dyson.device.refreshInterval.description = Interval in seconds at which the current state is requested from the device.
thing-type.config.dyson.device.removeUnsupportedChannels.label = Remove Unsupported Channels
thing-type.config.dyson.device.removeUnsupportedChannels.description = Removes the channels of features that the device does not report, shortly after the first connection. Re-create the thing to restore them.
thing-type.config.dyson.device.serialNumber.label = Serial Number
thing-type.config.dyson.device.serialNumber.description = Serial number of the device, e.g. VS6-EU-HJA1234A.

