# add-on

addon.dyson.name = Dyson Binding
addon.dyson.description = This binding integrates Dyson Wi-Fi connected air purifiers, fans, heaters, humidifiers and robot vacuums, using the Dyson cloud account for discovery and local or cloud MQTT for control.

